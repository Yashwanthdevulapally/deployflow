services:

  postgres:
    image: postgres:16
    container_name: deployflow-postgres
    restart: always

    environment:
      POSTGRES_USER: deployflow
      POSTGRES_PASSWORD: deployflow123
      POSTGRES_DB: deployflow_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deployflow -d deployflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: deployflow-backend
    restart: always

    env_file:
      - ./backend/.env

    ports:
      - "5001:5001"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:5001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: deployflow-frontend
    restart: always

    ports:
      - "3000:80"

    depends_on:
      backend:
        condition: service_healthy


volumes:
  postgres_data: