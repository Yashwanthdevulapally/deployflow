name: DeployFlow CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Node and npm versions
        run: |
          node -v
          npm -v

      - name: Install backend dependencies
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deployflow
        run: npm ci --legacy-peer-deps

      - name: Check backend TypeScript
        working-directory: backend
        run: npx tsc --noEmit

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build